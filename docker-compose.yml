services:
  # ── API ──────────────────────────────────────────────────────────────────
  soc-api:
    build: .
    command: python main.py start api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - SOC_PATH=/app/soc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── AGENTS ───────────────────────────────────────────────────────────────
  soc-scout:
    build: .
    user: root # Required for scapy/nmap low-level networking
    command: python main.py start scout
    volumes:
      - .:/app
    depends_on:
      - soc-api
    privileged: true # Required for network sniffing/ARP scans

  soc-triage:
    build: .
    command: python main.py start triage
    volumes:
      - .:/app
    depends_on:
      - soc-api

  soc-responder:
    build: .
    command: python main.py start responder
    volumes:
      - .:/app
    depends_on:
      - soc-api

  soc-orchestrator:
