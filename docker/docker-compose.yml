services:
  # ── LOCAL LLM ENGINE ─────────────────────────────────────────────────────
  soc-llm:
    image: ollama/ollama:latest
    container_name: soc-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── API ──────────────────────────────────────────────────────────────────
  soc-api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    command: python main.py start api
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - SOC_PATH=/app/soc
      - OLLAMA_API_URL=http://soc-llm:11434/v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── AGENTS ───────────────────────────────────────────────────────────────
  soc-scout:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    user: root # Required for scapy/nmap low-level networking
    command: python main.py start scout
    volumes:
      - ../backend:/app
    depends_on:
      - soc-api
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - OLLAMA_API_URL=http://soc-llm:11434/v1

  soc-triage:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile
    command: python main.py start triage
    volumes:
      - ../backend:/app
    depends_on:
      - soc-api
    environment:
      - OLLAMA_API_URL=http://soc-llm:11434/v1

  soc-responder:
